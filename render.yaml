# Free testing profile. Sleeps when idle; database expires after 30 days.
# Do not enable live payments or describe this as production certified.
services:
  - type: web
    name: cartnest-preview
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/docker/Dockerfile.render
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_BASE_URL
        sync: false
      - key: API_PUBLIC_BASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cartnest-preview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cartnest-preview-queue
          property: connectionString
  - type: keyvalue
    name: cartnest-preview-queue
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
databases:
  - name: cartnest-preview-db
    plan: free
    region: frankfurt
    databaseName: cartnest
    user: cartnest
    ipAllowList: []
