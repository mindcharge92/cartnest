name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: install-security-lint-codegen-typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cartnest
          POSTGRES_PASSWORD: cartnest_ci_only
          POSTGRES_DB: cartnest_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cartnest -d cartnest_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://cartnest:cartnest_ci_only@127.0.0.1:5432/cartnest_test_ci
      TEST_DATABASE_URL: postgresql://cartnest:cartnest_ci_only@127.0.0.1:5432/cartnest_test_ci
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Scan repository for committed secrets
        run: pnpm security:scan
      - name: Audit dependencies for high/critical advisories
        run: pnpm security:audit
      - name: Lint and architecture boundaries
        run: pnpm lint
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Regenerate OpenAPI and typed client
        run: pnpm api:generate
      - name: Apply migrations and verify repeat deployment
        run: |
          pnpm --filter @repo/database db:migrate:deploy
          pnpm --filter @repo/database db:migrate:deploy
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test --force --concurrency=1
      - name: Build
        run: pnpm build
      - name: Check documentation links
        run: pnpm docs:check
