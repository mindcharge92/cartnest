name: cartnest-staging

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_HOST: ${WEB_HOST:-localhost}
      API_HOST: ${API_HOST:-api.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    networks: [edge, private]

  web:
    image: ${WEB_IMAGE:-cartnest-web:${RELEASE_SHA:-staging}}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.localhost}
    expose: ["3000"]
    networks: [edge]

  migrate:
    image: ${API_IMAGE:-cartnest-api:${RELEASE_SHA:-staging}}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    profiles: ["migration"]
    env_file:
      - ${STAGING_ENV_FILE:-./staging.env}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-cartnest}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cartnest}}
    command: ["pnpm", "--filter", "@repo/database", "db:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  api:
    image: ${API_IMAGE:-cartnest-api:${RELEASE_SHA:-staging}}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-./staging.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-cartnest}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cartnest}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AUTH_COOKIE_SECURE: "true"
      AUTH_EXPOSE_DEVELOPMENT_TOKENS: "false"
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, private]

  worker:
    image: ${WORKER_IMAGE:-cartnest-worker:${RELEASE_SHA:-staging}}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-./staging.env}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-cartnest}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cartnest}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [private, egress]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cartnest}
      POSTGRES_USER: ${POSTGRES_USER:-cartnest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cartnest} -d ${POSTGRES_DB:-cartnest}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

networks:
  edge:
  egress:
  private:
    internal: true

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
